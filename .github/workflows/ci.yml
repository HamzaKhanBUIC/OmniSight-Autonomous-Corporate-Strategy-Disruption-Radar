name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The tests only need httpx; the full agent stack (cognee, speechmatics) is not installed
      - name: Install test tools
        run: pip install pytest httpx bandit

      - name: Tests
        run: pytest -q

      - name: Bandit
        run: bandit -q -r . -x ./tests
